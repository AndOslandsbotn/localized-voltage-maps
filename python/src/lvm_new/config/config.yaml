# Localized Voltage Maps: default settings, the only place default values are defined.
#
# A run's own YAML file (LocalizedVoltageMaps(config=path)) needs only the keys it changes; they are merged over these
# defaults, and the direct arguments of LocalizedVoltageMaps are applied last. Types and allowed ranges are checked
# by the models in config.py.

compute:
  device: auto           # auto (CUDA if a GPU is available, else the CPU) | cuda | cpu
  seed: 0                # every step's seed; a region's seed is derived from it and the region's id

data:
  chunk_size: 10000      # points per chunk when an array is read in pieces; a re-iterable's own pieces are used as
                         # they come. Streaming k-means updates once per chunk, so results depend on it

sample:                  # the region's sample, held in memory (dimension estimate, k-means, local chart)
  strategy: prefix       # prefix: the first points; the data must be in random order (fast: stops reading)
                         # reservoir: uniform over one full pass; for data in any order
  size: 50000            # points in the sample (all of them if the data has fewer)

dimension:               # the region's intrinsic dimension d̂, estimated from its sample; sets the number of landmarks
  strategy: mle          # mle: Levina & Bickel (2005) on k-NN distances | fixed: given d
  sample_size: 10000     # points of the region's sample used (mle); all if the sample is smaller
  mle:
    k: 20                # neighbours per point
  fixed:
    d: 12.0              # the dimension, when it is known

cells:
  n_cells: 300           # number of cells (graph nodes) per region
  kmeans:                # k-means on the sample
    strategy: auto       # auto: cuml on cuda, lloyd on cpu | cuml (GPU only) | lloyd (torch, either device)
    cuml:
      init: random       # random | k-means||
      max_iter: 30
      tol: 1.0e-4
    lloyd:
      iterations: 25
  refine:                # mini-batch k-means over the stream after k-means on the sample (Sculley 2010): one chunk
                         # + the centroids in memory, for any size of data
    passes: 0            # scans of the data; 0 = no refinement
    max_points: null     # points streamed per pass at most (null = all)
  masses:                # each cell's share of the data, counted in a streamed pass
    rel_error: 0.05      # stop once every cell has >= 1/rel_error^2 points (400): ~5% error per mass. Only for data
                         # in random order (sample.strategy prefix); otherwise one full pass
    max_points: null     # points read at most (null = all)

graph:                   # the graph between cells
  radius:                # each cell's radius; two cells are joined within max(r_i, r_j)
    strategy: adaptive_per_cell   # adaptive_per_cell: each cell's distance to its k-th nearest cell (symmetric kNN
                         #   graph: every cell has >= k edges) | knn: one radius, the median distance to the k-th
                         #   nearest cell | point_knn: one radius, the median distance from a data point to its k-th
                         #   nearest cell | centroid_spacing: one radius, multiplier x median nearest-cell distance
    adaptive_per_cell:
      k: 10
    knn:
      k: 10
    point_knn:
      k: 10
      sample_size: 5000  # data points of the sample used
    centroid_spacing:
      multiplier: 3.0
  kernel:                # edge weight from distance d and pair radius r
    strategy: radial     # radial: 1 if d <= r | tapered: (1 - d^2/r^2)+ | gaussian: exp(-d^2 / (2 (sigma r)^2)),
                         #   0 beyond cutoff * sigma * r
    gaussian:
      sigma: 0.3333
      cutoff: 3.0
  connect: true          # join every piece of the graph to the largest by its shortest link (weight 1)

voltage:
  threshold: 1.0e-3      # tau: a map's support is where its voltage is >= tau

landmarks:               # the landmarks and their reach rho_g, chosen together
  count:                 # how many landmarks (at least n_components + 1, at most the number of cells)
    strategy: dimension  # dimension: ceil(multiplier * (d + 1)); d + 1 landmarks pin down a point in d dimensions
                         # fixed: n
    dimension:
      multiplier: 1.0
    fixed:
      n: 20
  mutual_information:    # chosen greedily by the mutual information between a cell and its noisy voltages
    noise_std: 0.01      # the noise
  reach:                 # rho_g: the most local maps for which the chosen landmarks still reach the data
    k: null              # landmarks that must reach a point (v >= tau); null = all of them
    share: 0.9           # share of the data (by mass) that must be reached by at least k landmarks
    rel_tolerance: 0.05  # bisection on rho_g stops when its bracket is this narrow (relative)
    rho_g_bounds: [1.0e-6, 1.0e+6]

embedding:
  landmark_mds:
    n_components: 2      # dimension of the embedding
  local_chart: last      # points placed within their cell along the cell's main directions (the local chart):
                         # last: charts at the deepest level during fit, other levels on demand; all: at every level
                         # during fit; none: plain coordinates (points of a cell close to its centre)

hierarchy:
  levels: 1              # depth of the hierarchy (only 1 for now)
