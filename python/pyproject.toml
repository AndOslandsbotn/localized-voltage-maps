[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localized-voltage-maps"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "pydantic>=2",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lvm"]

[tool.pytest.ini_options]
pythonpath = ["tests"]          # tests/helpers.py, importable from unit/, integration/ and regression/
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gpu: needs a CUDA GPU (skipped automatically without one; deselect with -m 'not gpu')",
]
