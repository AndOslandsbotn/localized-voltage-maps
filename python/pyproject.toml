[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localized-voltage-maps"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "pydantic>=2",
    "scikit-dimension",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lvm"]

[tool.pytest.ini_options]
pythonpath = ["tests_old"]      # tests_old/helpers.py, for the old code's tests (pytest tests_old)
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gpu: needs a CUDA GPU (skipped automatically without one; deselect with -m 'not gpu')",
]
