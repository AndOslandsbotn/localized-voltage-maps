# Localized Voltage Maps -- default configuration.
#
# Loaded by lvm.config.load_config(). A run's own YAML file only needs the
# keys it changes; they are merged over these defaults.
#
# Pipeline, one level of the hierarchy (repeated inside each child region):
#   sample points -> k-means cells + streamed masses -> mass-weighted graph
#   -> per-node ground -> voltage maps -> threshold -> landmarks
#   -> child regions -> recurse
#
# Sections that offer several methods use the same pattern:
#   strategy: <name>     # which method to use
#   <name>: {...}        # options for that method only

compute:
  device: cuda           # cuda | cpu -- torch device for the voltage solves
  dtype: float64         # float64 | float32
  seed: 0

data:
  path: null             # input file (CSV); must be set per run
  format: csv
  csv:
    delimiter: ","
    skip_header: 0       # number of header lines to skip
  chunk_size: 10000      # rows read per chunk while streaming; per-chunk memory ~ chunk_size x n_cells
  shuffled: true         # input is pre-shuffled: the first points of a region are an i.i.d. sample,
                         # so sampling stops early. false: reservoir sampling over the full scan

cells:                   # Voronoi cells (k-means) for each region
  n_cells: 1000          # m_v: number of cells = graph nodes; size to what the hardware can solve
  sample_size: 50000     # points collected per region to fit k-means (>> n_cells)
  kmeans:
    strategy: cuml       # cuml: RAPIDS k-means on the GPU (0.3 s for 50k x 784 -> 1000 cells)
                         # faiss: FAISS k-means on the CPU, multi-threaded (~12 s)
                         # sklearn: scikit-learn KMeans on the CPU, the reference implementation (~70 s)
    cuml:
      init: random       # random | k-means|| -- random: 0.3 s vs 4 s, inertia within 0.2%
      max_iter: 30
      tol: 1.0e-4
    faiss:
      niter: 25          # Lloyd iterations
    sklearn:
      max_iter: 30
      tol: 1.0e-4
  refine:                # after k-means on the sample: the centroids fitted to the whole stream
    strategy: none       # none: k-means on the sample only (memory and time independent of n)
                         # stream: mini-batch k-means (Sculley 2010) over the data, chunk by chunk, from the
                         #   sample's centroids: each centroid is the running mean of the points assigned to it
                         #   (the sample's points count from the start). Memory: one chunk + the centroids, for any n
    stream:
      passes: 1          # scans of the data
      max_points: null   # points streamed per pass at most (null = all)
  masses:                # cell masses p_i, estimated by streaming
    rel_error: 0.05      # typical (1 std) relative error per cell: stop once every cell has
                         # >= 1/rel_error^2 points (only with data.shuffled; else full scan)
    max_points: null     # hard cap on points streamed per level (null = no cap)

graph:
  kernel:
    strategy: radial     # radial: k = 1{d <= r} (the disk kernel of the paper's shape theorems)
                         # tapered: k = (1 - d^2/r^2)_+, smooth but still zero beyond r
                         # gaussian: k = exp(-d^2 / (2 (sigma r)^2)), cut to 0 beyond cutoff * sigma * r
    gaussian:
      sigma: 0.3333      # width as a fraction of r
      cutoff: 3.0        # in widths: 3 * r/3 = r, the same support as the other two
  radius:                # kernel radius r, recomputed for every region
    strategy: adaptive_per_cell  # adaptive_per_cell (default since 2026-10-03, see below): a radius per cell
                         # knn: one radius; a typical cell has ~k neighbours, in any dimension
                         # centroid_spacing: multiple of the nearest-neighbour distance; fine in low
                         #   dimensions, but connects almost every cell in high ones (distances concentrate)
    knn:
      k: 10              # r = median over cells of the distance to their k-th nearest centroid
    point_knn:           # point_knn: a typical *data point* has ~k cells within r. In high dimensions
      k: 10              #   points sit on a shell around the centroids, farther out than the centroid
      sample_size: 5000  #   spacing, so this r is larger than knn's (Def. 10 / Thm 11 assume cells << r)
    centroid_spacing:
      multiplier: 3.0    # r = multiplier * median nearest-neighbour centroid distance
    adaptive_per_cell:   # adaptive_per_cell: each cell its own radius r_i, the distance to its k-th nearest centroid;
      k: 10              #   two cells are joined when either is within the other's radius (r_ij = max(r_i, r_j):
                         #   the symmetric kNN graph), so every cell has >= k edges. One global r under-connects
                         #   varied digits (MNIST8M's 0s: 2 edges per cell, graph paths 3.7x the straight distance,
                         #   blown up) and over-connects compact ones (1s: squeezed); mnist8m/diagnostics/connectivity
  edge_weighting: mass   # mass: W_ij scaled by p_i p_j (Effective resistance paper, Def 11)
  connect: true          # join every disconnected piece of the cell graph to the main piece by its shortest link
                         #   (weight 1). A cell no edge reaches can still be chosen as a landmark (its map identifies
                         #   it perfectly), but it reaches nothing, so `reach` with k = all becomes impossible and
                         #   rho_g runs to its lower bound: nearly flat maps, a collapsed embedding (MNIST8M;
                         #   demonstrations/isolated_landmark)

ground:
  weighting: mass        # mass: rho_i = rho_g * p_i (per node)

sources:                 # which nodes are clamped to voltage 1 for a candidate landmark
  strategy: single_node

voltage:
  solver: dense_inverse  # one Cholesky inverse per graph, shared by all landmarks
  threshold: 1.0e-3      # tau: voltages below this are set to 0

scaling:                 # chooses rho_g for each region (bisection on log rho_g in every strategy)
  strategy: reach        # coverage: maps sized so the region's landmarks cover each cell ~overlap times
                         # support_fraction: a typical map covers a fixed fraction `target` of the cells
                         # reach: a typical data point is reached (v >= tau) by k of the chosen landmarks
  reach:
    k: null              # landmarks that must reach a typical point; null = all of them (d+1 with
                         # landmarks.count: dimension -- enough to triangulate a d-dimensional position)
    quantile: 0.1        # "typical": this mass-weighted quantile of the per-cell reach counts
                         # (0.5 = median point; 0.1 = 90% of the data is reached by >= k landmarks)
    rel_tolerance: 0.05  # stop when the bracket on rho_g is within this relative width
    max_iter: 40
    rho_g_bounds: [1.0e-6, 1.0e+6]
                         # Landmarks depend on rho_g and reach on the landmarks, so rho_g and the landmarks
                         # are found by alternation: select at rho_g, bisect rho_g with that set fixed, repeat
    max_rounds: 5        # selections at most; usually 2-3
    round_tolerance: 0.15  # stop once rho_g changes by at most this relative amount between rounds
    start_max_iter: 6    # bisection steps for the start, where a typical candidate map covers
                         # min(k / L, 1 - quantile) of the data (needs no landmarks)
    start_factor: 1.0    # multiplies the start; only for checking that the result doesn't depend on it
  coverage:
    overlap: 8.0         # target support fraction = overlap / number of landmarks (capped at 1); Landmark MDS
                         # needs landmarks to reach each other: on MNIST 2 -> 8 raised trust 0.87 -> 0.93
    statistic: median    # median | mean -- "typical" over the maps of all cells with mass
    tolerance: 0.005     # stop once |typical fraction - target| <= tolerance
    max_iter: 50         # bisection steps on log(rho_g) at most
    rho_g_bounds: [1.0e-6, 1.0e+6]   # search range for rho_g
  support_fraction:
    target: 0.05         # rho_g chosen so a typical voltage map is nonzero on ~5% of cells
    statistic: median
    tolerance: 0.005
    max_iter: 50
    rho_g_bounds: [1.0e-6, 1.0e+6]

dimension:               # intrinsic dimension d of the region, estimated from its sample at fit time
  strategy: mle          # mle: Levina-Bickel maximum likelihood; twonn: Facco et al. 2017 (both via
                         #   scikit-dimension); fixed: use a given d
  mle:
    k: 20                # neighbours per point
    sample_size: 10000   # points of the region's sample used (MNIST 10k: d ~ 12.3; kNN 0.1 s GPU, 0.75 s CPU)
  twonn:
    sample_size: 10000
  fixed:
    d: 12.0

landmarks:
  strategy: mutual_information   # mutual_information: greedy MI between cell identity and voltages
                         # maxmin: farthest-point selection on voltage distance (spread)
                         # combined: the first share by one of them, the rest by the other, chosen given the
                         #   first ones. All four are tied on the metrics (benchmarks/ablations/landmarks); MI is
                         #   the default for its pictures (separate clusters rather than arms)
  count:                 # how many landmarks
    strategy: dimension  # fixed: n_landmarks; dimension: ceil(multiplier * (d_hat + 1))
    dimension:
      multiplier: 1.0    # 1: the d+1 needed to triangulate a d-dimensional position; 2: redundancy
  n_landmarks: 20        # used by count.strategy fixed
  mutual_information:
    noise_std: 0.01      # Gaussian noise added to voltages in the MI estimate
    precision: float32   # float32 | float64 for the candidate scoring; consumer GPUs run float64
                         # at a small fraction of float32 speed
    scratch_mb: 128      # temporary memory per scoring chunk (a few chunk-sized tensors coexist)
  combined:
    first: maxmin
    second: mutual_information
    fraction: 0.5        # share of the landmarks chosen by `first` (rounded up)

extension:               # voltages at individual data points (not just at cells)
  strategy: average      # grounded: a point is a zero-mass node of the network, with its own ground,
                         #   v(x) = sum_i k(x,c_i) p_i v_i / (rho_g + sum_i k(x,c_i) p_i);
                         # average: Def. 10 of the paper as printed, no ground term,
                         #   v(x) = sum_i k(x,c_i) p_i v_i / sum_i k(x,c_i) p_i (a point interpolates
                         #   between cells; with few cells attached, grounded's rho_g roughly halves it)
                         # either way, a point with no cell within reach takes its nearest cell's voltages
  kernel: knn            # k(x, c_i) above: graph = graph.kernel; or radial | tapered | gaussian (with
                         #   graph.kernel's gaussian options). With radial, every point near the same
                         #   cells gets the same voltages, so points pile up on ~1500 spots (MNIST 50k)
                         # knn: each point's k nearest cells, w_i = exp(-(d_i^2 - d_1^2) / (2 s^2)) with s^2
                         #   the point's mean excess d_i^2 - d_1^2 (adapts to each point; no fallback needed)
  knn:                   # MNIST tuning split (diagnostics/kernels): k 3, sharpness 16 gave trust 0.962,
    k: 3                 #   5-NN 0.864 vs the radial kernel's 0.927, 0.826
    sharpness: 16.0      # divides s^2: larger keeps a point closer to its nearest cell (less mixing
                         #   across clusters), smaller spreads it over its k cells (less piling up)

embedding:               # low-dimensional coordinates from the landmark voltage maps
  strategy: landmark_mds # log_mds: classical MDS (= mass-weighted PCA) on features -log(max(v, tau))
                         # landmark_mds: Landmark MDS (de Silva & Tenenbaum 2004) on voltage distances
                         #   d = -log v: landmarks placed by classical MDS, points by triangulation
  log_mds:
    n_components: 2
  landmark_mds:
    n_components: 2
    missing: chain       # distance where v < tau (outside a map's support) is unknown:
                         # clip: use -log(tau), i.e. "at least this far"
                         # chain: go through landmarks in reach, d(x,l) = min_j d(x,j) + d(j,l)
  distance_floor: 1.0e-10  # epsilon: distances d = -log v are read from voltages down to epsilon; below it a
                         #   distance is unknown (chained or clipped). null = voltage.threshold (tau). tau keeps
                         #   its other roles (support, reach -> rho_g, landmark selection). Chaining overestimates
                         #   (a detour through another landmark), so switching to it where v falls below tau tears
                         #   embeddings along the map edges (demonstrations/sphere_tears)
  local_scale:           # a second, local scale for the points of each cell (the global layout of the
    strategy: none       #   cells is kept): none | cell. Differences in -log v within a cell are tiny next
                         #   to those between cells, so a cell's points are correctly ordered but squeezed
                         #   onto a spot. cell: z' = a_c + alpha_c (z - a_c) around the mean a_c of the
                         #   cell's points, with alpha_c = fill * (distance to the nearest other a) / spread
    cell:
      fill: 0.5          # a cell's points spread over this share of the distance to its nearest neighbour
    pca:                 # pca: within each cell, the 2 main directions of its points' raw features
      fill: 0.6          #   (rotated to match the cell's LVM offsets), median point at fill * nearest-cell distance

partition:               # how cells are split into child regions
  strategy: support      # argmax: disjoint, cell goes to its highest-voltage landmark
                         # support: overlapping, cell goes to every landmark with v >= tau
  uncovered:             # cells with v < tau for every landmark
    strategy: highest_voltage   # assign to the landmark with the highest voltage

stopping:
  strategy: max_depth
  max_depth:
    depth: 3             # number of levels; level 0 is the whole dataset

output:
  dir: outputs
