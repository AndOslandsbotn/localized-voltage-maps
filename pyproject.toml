[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localized-voltage-maps"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["lvm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
